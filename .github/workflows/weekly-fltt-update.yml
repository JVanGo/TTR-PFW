name: Weekly results update

# Runs automatically every Friday at 08:00 Luxembourg time (06:00 UTC —
# this drifts to 07:00 local once Luxembourg switches back to winter time in
# late October, since GitHub's schedule only understands UTC). The
# federation's own weekly Thursday upload has no fixed time and is spread
# over hours (2026-10-15: 12:40-17:05 local, most files in the last 25 min);
# the old Thursday 11:00 slot, started ~5h late by GitHub, read mid-upload
# and missed many of that week's matches. Friday morning leaves a wide margin.
on:
  schedule:
    - cron: "0 6 * * 5"
  # Lets a person start it by hand from GitHub's Actions tab, e.g. to test it.
  workflow_dispatch: {}

jobs:
  update:
    name: Sync player list + recalculate season ratings
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CONFIRM: "YES"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Updates class/PFW/club for tracked players and adds genuinely new
      # ones. Runs first so the season recalculation below sees the latest
      # player list. Safe to re-run — see the script's own doc comment.
      - name: Sync player catalog
        run: npx tsx scripts/import-fltt-catalog-r2-prod.ts

      # Recomputes the whole season's ratings from every match result seen so
      # far, replacing what's on the live site. Safe to re-run — always
      # recomputes from scratch rather than layering on top of last time.
      - name: Recalculate season ratings
        run: npx tsx scripts/simulate-season-ttr-prod.ts

      # Freezes the Verbandsrangliste (everyone's DTR on 1 Aug / 1 Jan) the
      # first time this runs on or after each date, from the ratings just
      # recalculated above. Does nothing once that Teilrunde's snapshot exists.
      - name: Take Verbandsrangliste snapshot
        run: npx tsx scripts/take-verbandsrangliste-snapshot-prod.ts
