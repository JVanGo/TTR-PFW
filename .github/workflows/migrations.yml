name: migrations

on:
  push:
    branches:
      - master

jobs:
  apply:
    name: Apply Supabase migrations to production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      # Pinned (not "latest"): v2.112.0 has a regression where `link` fails
      # with a SchemaError decoding a project's API keys (its inserted_at
      # timestamp validation is stricter than what the Management API
      # actually returns) — https://github.com/supabase/cli/issues/6115.
      # Bump this once a release after 2.112.0 fixes it.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push
